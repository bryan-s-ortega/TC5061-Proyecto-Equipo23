version: '3'

vars:
  PROJECT_NAME: mibici
  PYTHON_VERSION: '3.13'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  sync:
    desc: Sync dependencies using uv.lock
    aliases: [requirements]
    cmds:
      - uv sync

  clean:
    desc: Delete all compiled Python cache files
    cmds:
      - find . -type f -name "*.py[co]" -delete
      - find . -type d -name "__pycache__" -delete

  lint:
    desc: Lint code using ruff
    cmds:
      - uv run ruff format --check
      - uv run ruff check

  format:
    desc: Format source code with ruff
    cmds:
      - uv run ruff check --fix
      - uv run ruff format

  test:
    desc: Run test suite using pytest
    cmds:
      - uv run pytest tests

  deepchecks:
    desc: Validate P1 data using DeepChecks
    preconditions:
      - sh: test -x .venv-deepchecks/bin/python
        msg: Prepare .venv-deepchecks with requirements-deepchecks.txt as documented in README.
      - sh: test -f data/processed/p1_demanda_diaria.csv
        msg: Prepare P1 dataset before running DeepChecks.
    cmds:
      - .venv-deepchecks/bin/python -m mibici.validation.deepchecks_validation

  security:
    desc: Run all basic security checks (Bandit SAST and pip-audit SCA)
    aliases: [security:check]
    cmds:
      - uv run bandit -r mibici -ll
      - uv run pip-audit

  dvc:pull:
    desc: Pull data from remote GCS storage
    cmds:
      - uv run dvc pull

  dvc:push:
    desc: Push data to remote GCS storage
    cmds:
      - uv run dvc push

  api:
    desc: Run FastAPI prediction API service in local development mode
    cmds:
      - uv run uvicorn mibici.api.main:app --reload --host 0.0.0.0 --port 8000

  api:extract-model:
    desc: Extract and package champion model from MLflow/DagsHub Model Registry
    cmds:
      - uv run python -m mibici.api.extract_model

  api:container:build:
    desc: Build container image using Containerfile and uv.lock
    cmds:
      - docker build -t mibici-p2-api:latest -f Containerfile .

  api:container:run:
    desc: Run containerized FastAPI service on port 8000
    cmds:
      - docker run --rm -p 8000:8000 mibici-p2-api:latest
